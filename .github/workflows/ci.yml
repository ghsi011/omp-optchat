name: Verify
on:
  push:
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: verify (${{ matrix.sdk }} SDK)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sdk: [pinned, latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install pinned lockfile
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Upgrade SDK cohort to latest (ephemeral, not saved)
        if: matrix.sdk == 'latest'
        run: >-
          bun add --no-save --ignore-scripts
          @oh-my-pi/pi-ai@latest
          @oh-my-pi/pi-catalog@latest
          @oh-my-pi/pi-coding-agent@latest
      - name: Record installed SDK version
        run: >-
          node -p "JSON.parse(require('fs').readFileSync('node_modules/@oh-my-pi/pi-coding-agent/package.json','utf8')).version"
      - run: bun run typecheck
      - run: bun test
      - run: bun run smoke
        env:
          OPTCHAT_SMOKE_OMP: ./node_modules/.bin/omp
  opencode:
    name: OpenCode 2.0.27 loopback smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Install pinned dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Download the pinned official OpenCode binary
        run: |
          mkdir -p "$RUNNER_TEMP/optchat-opencode"
          cd "$RUNNER_TEMP/optchat-opencode"
          curl --fail --location --retry 3 \
            https://registry.npmjs.org/@opencode/cli-linux-x64-baseline/-/cli-linux-x64-baseline-2.0.27.tgz \
            --output opencode.tgz
          printf '%s  %s\n' \
            acb0c26ebae126d66fe1683b09209a2b29a904a13177c65d5714e9d88dbf7257 \
            opencode.tgz | sha256sum --check
          tar -xzf opencode.tgz
          ./package/bin/opencode --version
      - name: Verify the real host with a local model fixture
        run: bun run smoke:opencode
        env:
          OPTCHAT_SMOKE_OPENCODE: ${{ runner.temp }}/optchat-opencode/package/bin/opencode
